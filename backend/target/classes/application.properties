# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/belong_db
spring.datasource.username=belong_user
spring.datasource.password=belong_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=BelongAppSecretKey2024PleaseChangeThisInProductionItMustBe256BitsLong
app.jwt.expiration-ms=2592000000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.belong=DEBUG
logging.level.org.springframework.security=WARN
