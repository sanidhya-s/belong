version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: belong_postgres
    environment:
      POSTGRES_DB: belong_db
      POSTGRES_USER: belong_user
      POSTGRES_PASSWORD: belong_pass
    ports:
      - "5432:5432"
    volumes:
      - belong_pgdata:/var/lib/postgresql/data
      - ./src/main/resources/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  app:
    build: .
    container_name: belong_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/belong_db
      SPRING_DATASOURCE_USERNAME: belong_user
      SPRING_DATASOURCE_PASSWORD: belong_pass
      APP_JWT_SECRET: BelongAppSecretKey2024PleaseChangeThisInProductionItMustBe256BitsLong
    depends_on:
      - postgres
    restart: on-failure

volumes:
  belong_pgdata:
